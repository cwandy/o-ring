    - "Termal ölçekleme: L(T) = L_ref (1 + ε(T)) / (1 + ε(T_ref)), ε 293.15 K referanslı ΔL/L tablolarından PCHIP ile enterpole edilir; sabit CTE kullanılmaz."
    - "Stretch iç çap bazlıdır; kesit incelmesi seçilen yönteme göre hesaplanır (hacim korunumu merkez çap / Parker hesaplanmış / Parker ampirik eğri)."
    - "Squeeze = (W_eff - L) / W_eff; radyal yuvalarda eksantriklikle boşluk bir tarafa toplanır (dar ve geniş taraf ayrı değerlendirilir)."
    - "Yuva doluluğu = π W_eff² / 4 · (1 + şişme) / (L · G − köşe radyüsleri); şişme yalnızca alana uygulanır."
    - "Ekstrüzyon kontrolü Parker Şekil 3-2'ye göre (71 °C, 100.000 çevrim, destek halkasız); silikon için izin verilen aralık %60 azaltılır."
    - "Elastomer düşük sıcaklık sınırı Parker'ın aile bazında önerilen statik sınırıdır (≈ TR-10 − 8 °C); sınırın 8 K üstüne kadar uyarı verilir."
    - "Kesit çizimindeki sıkışmış o-ring şekli alanı koruyan stadyum yaklaşımıdır."

formulas:
  title: "Formülasyon — programın kullandığı tüm formüller"
  intro: "Simgeler: ID o-ring iç çapı, W kesit, W' montaj sonrası kesit, L yuva derinliği (sıkışma yüksekliği), G yuva genişliği, R taban köşe radyüsü, c çapsal boşluk, e eksantriklik, p basınç. Tüm hesaplar SI birimlerinde yapılır."
  sections:
    - title: "1. Termal ölçekleme"
      items:
        - eq: "L(T) = L_ref · (1 + ε(T)) / (1 + ε(T_ref))"
          note: "ε(T): malzemenin 293.15 K referanslı ΔL/L tablosu, PCHIP ile enterpole. Sabit genleşme katsayısı kullanılmaz. Tablo dışında hesap yapılmaz. O-ring ölçüleri conta malzemesiyle, yuva ölçüleri gövde malzemesiyle, karşı parça kendi malzemesiyle ölçeklenir."
        - eq: "ΔV/V₀ = k³ − 1,   k = (1 + ε_conta(T)) / (1 + ε_conta(T_ref))"
          note: "O-ring hacim değişimi (izotropik büzülme)."
    - title: "2. Gerdirme ve kesit incelmesi"
      items:
        - eq: "s = (D_temas − ID) / ID"
          note: "D_temas: o-ring iç çapının oturduğu çap (piston: yuva tabanı, rod: rod, face dış basınç: yuva iç çapı). Parker 3.5."
        - eq: "W'² · (D_temas + W') = W² · (ID + W)"
          note: "Varsayılan yöntem: torus hacmi korunur (merkez çaplarla); W' Newton yöntemiyle çözülür."
        - eq: "Y = 1 − 1/√(1 + s)"
          note: "Parker Şekil 3-3 'hesaplanan' eğrisi: W' = W(1 − Y)."
        - eq: "0 ≤ X ≤ 3: Y = −0.005 + 1.19X − 0.19X² − 0.001X³ + 0.008X⁴;   3 < X ≤ 25: Y = 0.56 + 0.59X − 0.0046X²"
          note: "Parker Şekil 3-3 ampirik eğrisi (X, Y yüzde). X > %25 geçerli aralık dışı."
        - eq: "çevresel sıkışma = (OD − D_yuva,dış) / OD"
          note: "Pozitif: o-ring dış çapı yuva dış duvarınca sıkıştırılıyor."
    - title: "3. Squeeze, boşluk ve ekstrüzyon"
      items:
        - eq: "squeeze = (W' − L) / W'"
          note: "Negatif: o-ring karşı yüzeye temas etmiyor."
        - eq: "Piston: L = (A − B)/2,   Rod: L = (F − D)/2,   Face: L = yuva derinliği"
          note: "A silindir çapı, B yuva taban çapı, D rod çapı, F yuva dış çapı."
        - eq: "L_min,max = L_nom ∓ e,   e = c/2 (tam eksantrik, varsayılan)"
          note: "Radyal yuvada boşluk tek tarafta toplanabilir (en kötü durum)."
        - eq: "g_maks = c/2 + e"
          note: "En büyük tek taraflı ekstrüzyon aralığı. İzin verilen aralık: Parker Şekil 3-2 (basınç, sertlik); silikonda yarıya indirilir."
    - title: "4. Yuva doluluğu"
      items:
        - eq: "doluluk = (π W'² / 4) · (1 + şişme) / (L · G − 2 (1 − π/4) R²)"
          note: "Yuva dikdörtgen kabul edilir, iki taban köşe radyüsü alandan düşülür. Parker 3.7: en az %10 boşluk."
    - title: "5. Kuvvetler"
      items:
        - eq: "q = f(W, squeeze, Shore A)  [N/m]"
          note: "Parker Şekil 2-4…2-8 sıkıştırma kuvveti: squeeze'de log-doğrusal, sertlikte doğrusal, kesitte log-log enterpolasyon; aralık dışına çıkılmaz."
        - eq: "q = W · E · (α_T + k · β_T),   x = W (1 − cos θ),   α_T = 4/3 ln(sec θ + tan θ) − 4/3 sin θ,   β_T = −1/2 ln(sec θ + tan θ) + 1/3 sin θ + 1/6 sec θ tan θ"
          note: "Parker grafiklerinin kapsamadığı elastomer koşulları: Lindley (1966) toroidal halka formülü, denklem (8). E ve k sertlikten (Lindley Ek 1: 35–75 IRHD; dışında ekstrapolasyon). %30 üzeri sıkışmada kuvveti düşük tahmin eder."
        - eq: "q_termoplastik = min( W · E · α_T ,  σ_akma · W · sin θ )"
          note: "PTFE / PCTFE: elastik ezilme (Lindley, kauçuk şekil terimi olmadan) ve temas basıncının malzemenin akma gerilmesiyle sınırlanması. PTFE G400: E = 450 MPa (D695, %1'de 4–5 MPa), σ_akma = 13,7 MPa (D621). PCTFE C100: E = 1,0 GPa (D638), σ_akma ≈ 31 MPa (çekme dayanımı, tahmini)."
        - eq: "p_temas = q / (W · sin θ)"
          note: "Montaj sonrası ortalama temas basıncı (Lindley Şekil 3, yükü taşıyan dikdörtgen genişliği W sin θ)."
        - eq: "F_sıkıştırma = q · π · (ID + W)"
          note: "O-ring çevresi boyunca toplam sıkıştırma kuvveti."
        - eq: "F_basınç = p · π · D² / 4"
          note: "D: o-ringin basınç gören dış çapı (ID + 2W)."
        - eq: "F_sıkma,min = F_sıkıştırma(squeeze_maks) + F_basınç"
          note: "Face yuvada flanşın açılmaması için gereken en az cıvata kuvveti; güvenlik katsayısı içermez. Dış basınçta yalnızca sıkıştırma kuvveti."
    - title: "6. Yuva hesaplayıcı"
      items:
        - eq: "s_min = (x_min / W) / (1 − C),   s_max = %30"
          note: "Bileşik seçilirse hedef band malzemeden: C kalıcı sıkışma (veri sayfası, ISO 815 / ASTM D621), x_min = 0.178 mm en az mutlak squeeze (Parker 3.6), s_max genel üst sınır (Parker 3.6). Ömür sonunda en kötü köşede bile en az x_min sıkışma kalır. Bileşik seçilmezse Parker Design Chart 4-2 / 4-3 bandı."
        - eq: "T_conta,min ≥ TR10"
          note: "Veri sayfasında TR10 (ISO 2921) varsa, altındaki sıcaklıkta o-ring geri dönemediği için uyarı verilir."
        - eq: "L: tüm sıcaklık × tolerans köşelerinde squeeze aralığının ortası = hedef bandın ortası (ikiye bölme)"
          note: "Hedef band: Parker Design Chart 4-2 / 4-3 (kesite en yakın satır); 0.01 mm'ye yuvarlanır."
        - eq: "G = G_tasarım · doluluk_maks / doluluk_sınırı  (en kötü köşede doluluk = sınır),  G ≥ 2R"
          note: "Doluluk sınırı varsayılan %85; 0.05 mm yukarı yuvarlanır."
    - title: "7. Tolerans analizi"
      items:
        - eq: "Worst-case: 2ⁿ tolerans köşesi + nominal nokta"
          note: "Her çıktının min/max'ı ve her kontrolün en kötü sonucu."
        - eq: "σᵢ = (üst − alt) / 6,   σ_y = √( Σ (∂y/∂xᵢ · σᵢ)² ),   aralık = y_orta ± 3σ_y"
          note: "RSS: türevler bant ortasında merkezi farklarla."
        - eq: "xᵢ ~ N(bant ortası, σᵢ)  veya  U(alt, üst)"
          note: "Monte Carlo: N örnek, tohum (seed) sabitlenebilir; her kontrol için GEÇER/UYARI/KALIR oranı."
        - eq: "ISO 286: sapma = tablo(sınıf, nominal çap);   js/JS = ± IT/2"
          note: "Tablo: JIS B 0401-2 = ISO 286-2, 3–500 mm (Miki Pulley özeti)."
    - title: "9. Katalog yuvası ve sıcaklık"
      items:
        - eq: "[s_nom(T_min) + s_nom(T_max)] / 2 = s_nom,katalog(20 °C)"
          note: "PTFE yuvası Trelleborg Tablo 48'den alınır (oda sıcaklığı tasarımı). 'Tablo derinliğini sıcaklık aralığına göre ortala' seçiliyse derinlik bu eşitliği sağlayacak şekilde ikiye bölme ile bulunur; genişlik ve radyüs tablodan kalır. Böylece soğuk ve sıcak uçta tablonun amaçladığı squeeze'den eşit sapılır."
    - title: "8. Sıcaklık sınırları"
      items:
        - eq: "T_conta < T_alt → KALIR;   T_alt ≤ T_conta < T_alt + bant → UYARI;   T_conta > T_üst → KALIR"
          note: "Elastomerler için statik düşük sıcaklık sınırı ve uyarı bandı (Parker 2.13.2)."
