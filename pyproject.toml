[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oring-designer"
version = "0.0.1"
description = "O-ring / gland design and verification tool with cryogenic focus"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pint",
    "pydantic>=2",
    "pyyaml",
    "pandas",
    "matplotlib",
    "reportlab>=5.1.0",
    "ezdxf>=1.4.5",
    "pyside6-essentials>=6.8",
]

[dependency-groups]
# streamlit + plotly: the browser version of the UI (app/), kept for development only;
# the Windows package ships the desktop UI (desktop/, PySide6).
dev = ["pytest", "streamlit", "plotly"]

[tool.hatch.build.targets.wheel]
packages = ["src/oring_designer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
