# Seal materials. See SPEC.md §5 and §13.
#
# thermal_strain:
#   reference_T_K : temperature at which the source's dL/L is zero. The loader re-references
#                   every table to 293.15 K (see thermal.py).
#   segments      : one entry per source/quality. kind = table | nist_poly4.
#     table: quantity = expansion  -> value = (L_T - L_ref)/L_ref
#            quantity = contraction -> value = (L_ref - L_T)/L_ref   (NBS Monograph 29 convention)
#            value is multiplied by `scale`.
#   An empty segment list means "no sourced data" (decision K3): scaling only at T = T_ref.
#
# QualifiedValue fields: {value, source (references.yaml id), data_quality, notes}.

DOGRULANMALI:
  - "Elastomer düşük/yüksek sıcaklık sınırları polimer ailesi seviyesinde (Parker 2.2). Kullanılan compound'un TR-10 değeri ile doğrulanmalı."
  - "Parker'da düşük sıcaklık marjı tutarsız: 2.13.2 'TR-10 - 8 C', 3.10.2 'TR-10 - 15 C'. Program 8 C kullanıyor (Parker'ın kendi sınırlarının dayanağı)."
  - "PVMQ düşük sıcaklık sınırı (-115 C) aday değer: Parker 'özel silikon compound'lar' diyor, PVMQ demiyor."
  - "Tg ve TR-10 değerleri compound'a özgü; hiçbir malzeme için girilmedi."
  - "NBR, EPDM, FKM, FFKM, PVMQ: kaynaklı ΔL/L tablosu yok (K3: boş). Tedarikçi/test verisi gerekli."
  - "VMQ ΔL/L: tek bir compound (Dow Corning Silastic 160, 77 Shore A2, 1952). Kullanılan compound için doğrulanmalı."
  - "PTFE 274-383 K: Kirby (1956) Şekil 2'den sayısallaştırıldı, Tablo 2'ye çapalandı (en büyük düzeltme 0.019 %)."
  - "PTFE ve PCTFE sertlik (Shore D) ve sıcaklık sınırları: kaynak yok."

