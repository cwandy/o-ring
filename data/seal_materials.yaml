    group: thermoplastic
    hardness_shore_d: {value: null, data_quality: placeholder}
    high_temp_limit_K: {value: null, data_quality: placeholder}
    phase_transition_notes: >-
      First-order crystal transitions at about 20 C (~293 K) and 30 C (~303 K); total length
      change across both about 0.24 % (Kirby 1956). Strained (non-annealed) PTFE can differ by
      up to ~20 % in expansion (Kirby 1956; NBS Monograph 29 note h).
    thermal_strain:
      reference_T_K: 298.15
      segments:
        - kind: table
          quantity: contraction
          scale: 1.0e-5
          source: nbs_mono29
          data_quality: extrapolated
          notes: >-
            NBS Monograph 29 Table 2.4 'Teflon' (reference 25 C). Kirby measured down to -190 C;
            values below 80 K are the monograph's extrapolation guided by Laquer and Head (1952).
          points:
            - [20, 2110]
            - [40, 2060]
            - [60, 2000]
