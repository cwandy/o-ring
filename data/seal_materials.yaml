          scale: 1.0
          source: parker_ord5700
          data_quality: literature
          notes: >-
            Parker ORD 5700 Table 2-5, perfluoroelastomer (Parofluor): coefficient of thermal
            expansion 1.8e-4 /F = 3.24e-4 /K only (no contraction column); applied linearly from
            24 C over the FFKM service range (-18 C .. 320 C).
          points:
            - [255.15, -0.013608]
            - [297.15, 0.0]
            - [593.15, 0.095904]

  - id: vmq
    name: "VMQ (silikon)"
    group: elastomer
    low_temp_limit_K:
      value: 219.15
      source: parker_ord5700
      data_quality: literature
      notes: "Parker 2.2.13 'Down to approximately -54 C, special compounds down to -115 C'; 3.10.2: S0383-70 to -115 C. Parker's recommended static low-temperature limit is about 8 C below TR-10 (2.13.2, p. 2-25)."
    high_temp_limit_K:
      value: 477.15
      source: parker_ord5700
      data_quality: literature
      notes: "Parker 2.2.13 'Up to approximately 204 C, special compounds up to 260 C'."
    thermal_strain:
      reference_T_K: 293.0
      segments:
        - kind: table
          quantity: contraction
          scale: 1.0e-5
          source: nbs_mono29
          data_quality: literature
          notes: >-
            NBS Monograph 29, Table 2.4 'Rubber, Silastic 160' (data from Laquer and Head 1952).
            Dow Corning silicone rubber, hardness 77 Shore A2, cured. Single compound; the
            monograph notes an uncured 48 Shore A2 sample agreed within its +/-25 % uncertainty.
            Values below Tg are included as measured (glassy state).
          points:
            - [20, 2296]
            - [40, 2276]
            - [60, 2231]
            - [80, 2161]
            - [100, 2066]
            - [120, 1951]
            - [140, 1816]
            - [160, 1656]
            - [180, 1466]
            - [200, 1246]
            - [220, 996]
            - [240, 721]
            - [260, 441]
            - [273, 256]
            - [280, 165]
            - [293, 0]
            - [300, -119]
        - kind: table
          quantity: expansion
          scale: 1.0
          source: parker_ord5700
          data_quality: literature
          notes: >-
            Parker ORD 5700 Table 2-5 'Silicone' expansion 24 -> 191 C 0.360 in./ft. = 0.0300,
            re-referenced to 293 K with the Monograph value at 297.15 K (+7.05e-4):
            (1 + 0.0300)(1 + 7.05e-4) - 1 = 0.030727. Different compound from the Monograph data
            (slopes agree near 300 K: 1.7e-4 vs 1.8e-4 /K).
          points:
            - [464.15, 0.030727]

  - id: pvmq
    name: "PVMQ (fenil silikon)"
    group: elastomer
    low_temp_limit_K:
      value: 158.15
      source: parker_ord5700
      data_quality: literature
      notes: "Parker 2.2.13: special (low-temperature) silicone compounds down to -115 C; 3.10.2: S0383-70 to -115 C. PVMQ (phenyl silicone) is the low-temperature silicone family; Parker does not use the ASTM name. Verify against the compound datasheet."
    high_temp_limit_K:
      value: 477.15
      source: parker_ord5700
      data_quality: literature
      notes: "Parker 2.2.13: silicones up to approximately 204 C (family level; PVMQ not named separately)."
    thermal_strain:
      reference_T_K: 297.15
      segments:
        - kind: table
          quantity: expansion
          scale: 1.0
          source: parker_ord5700
          data_quality: literature
          notes: >-
            Parker ORD 5700 Table 2-5 (typical, family level), 'Low-temperature type silicone': contraction 24 -> -54 C
            0.193 in./ft. and expansion 24 -> 191 C 0.396 in./ft. (divided by 12). Two-point mean
            values; the curve between the points is PCHIP-interpolated. PVMQ (phenyl silicone) is taken as Parker's low-temperature silicone type.
          points:
