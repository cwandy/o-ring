# Seal materials. See SPEC.md §5 and §13.
#
# thermal_strain:
#   reference_T_K : temperature at which the source's dL/L is zero. The loader re-references
#                   every table to 293.15 K (see thermal.py).
#   segments      : one entry per source/quality. kind = table | nist_poly4.
#     table: quantity = expansion  -> value = (L_T - L_ref)/L_ref
#            quantity = contraction -> value = (L_ref - L_T)/L_ref   (NBS Monograph 29 convention)
#            value is multiplied by `scale`.
#   An empty segment list means "no sourced data" (decision K3): scaling only at T = T_ref.
#
# QualifiedValue fields: {value, source (references.yaml id), data_quality, notes}.

DOGRULANMALI:
  - "Elastomer düşük/yüksek sıcaklık sınırları polimer ailesi seviyesinde (Parker 2.2). Kullanılan compound'un TR-10 değeri ile doğrulanmalı."
  - "Parker'da düşük sıcaklık marjı tutarsız: 2.13.2 'TR-10 - 8 C', 3.10.2 'TR-10 - 15 C'. Program 8 C kullanıyor (Parker'ın kendi sınırlarının dayanağı)."
  - "PVMQ = Parker'ın 'düşük sıcaklık tipi silikon'u kabul edildi (-115 C sınırı, Tablo 2-5 genleşmesi). Parker ASTM adı PVMQ'yu kullanmıyor."
  - "NBR, EPDM, FKM, PVMQ ΔL/L: Parker Tablo 2-5 iki noktalı aile ortalaması (-54 C / 24 C / 191 C). -54 C altı veri yok (PVMQ -54 C altında hesaplanamaz)."
  - "FFKM ΔL/L: yalnızca Parker (Parofluor) doğrusal katsayısı 1.8e-4 /F."
  - "VMQ ΔL/L: 300 K altı tek compound (Dow Corning Silastic 160, 1952); 300 K üstü Parker aile değeri."
  - "PTFE 274-383 K: Kirby (1956) Şekil 2'den sayısallaştırıldı, Tablo 2'ye çapalandı (en büyük düzeltme 0.019 %)."
  - "PCTFE: 300 K üstü ΔL/L ve üst kullanım sıcaklığı için açık kaynak bulunamadı (Daikin broşürü yalnızca +30 C'ye kadar). PCTFE hesabı 300 K'e kadar yapılır."

materials:
  # ------------------------------------------------------------------ elastomers
  - id: nbr
    name: "NBR (nitril)"
    group: elastomer
    low_temp_limit_K:
      value: 239.15
      source: parker_ord5700
      data_quality: literature
      notes: "Parker 2.2.1 'Cold flexibility: depending on individual compound, between -34 C and -57 C'. Conservative (warm) end; low-temperature NBR grades reach -57 C. Parker's recommended static low-temperature limit is about 8 C below TR-10 (2.13.2, p. 2-25)."
    high_temp_limit_K:
      value: 373.15
      source: parker_ord5700
      data_quality: literature
      notes: "Parker 2.2.1 'Up to 100 C with shorter life @ 121 C'."
    thermal_strain:
      reference_T_K: 297.15
      segments:
        - kind: table
          quantity: expansion
          scale: 1.0
          source: parker_ord5700
          data_quality: literature
          notes: >-
            Parker ORD 5700 Table 2-5 (typical, family level), Nitrile (NBR): contraction 24 -> -54 C
            0.108 in./ft. and expansion 24 -> 191 C 0.224 in./ft. (divided by 12). Two-point mean
            values; the curve between the points is PCHIP-interpolated.
          points:
            - [219.15, -0.009]
            - [297.15, 0.0]
            - [464.15, 0.018667]

  - id: epdm
    name: "EPDM"
    group: elastomer
    low_temp_limit_K:
      value: 216.15
      source: parker_ord5700
      data_quality: literature
      notes: "Parker 2.2.4 'Down to approximately -57 C'. Parker's recommended static low-temperature limit is about 8 C below TR-10 (2.13.2, p. 2-25)."
    high_temp_limit_K:
      value: 423.15
      source: parker_ord5700
      data_quality: literature
      notes: "Parker 2.2.4 'Up to 150 C (max. 204 C in water and/or steam)'."
    thermal_strain:
      reference_T_K: 297.15
      segments:
        - kind: table
          quantity: expansion
          scale: 1.0
          source: parker_ord5700
          data_quality: literature
          notes: >-
            Parker ORD 5700 Table 2-5 (typical, family level), Ethylene propylene (EPDM): contraction 24 -> -54 C
            0.155 in./ft. and expansion 24 -> 191 C 0.32 in./ft. (divided by 12). Two-point mean
            values; the curve between the points is PCHIP-interpolated.
          points:
            - [219.15, -0.012917]
            - [297.15, 0.0]
            - [464.15, 0.026667]

  - id: fkm
    name: "FKM (florokarbon)"
    group: elastomer
    low_temp_limit_K:
      value: 247.15
      source: parker_ord5700
      data_quality: literature
      notes: "Parker 2.2.7: static limit approximately -26 C, certain compounds to -46 C; dynamic -15 to -18 C. Parker's recommended static low-temperature limit is about 8 C below TR-10 (2.13.2, p. 2-25)."
    high_temp_limit_K:
      value: 477.15
      source: parker_ord5700
      data_quality: literature
      notes: "Parker 2.2.7 'Up to 204 C and higher temperatures with shorter life expectancy'."
    thermal_strain:
      reference_T_K: 297.15
