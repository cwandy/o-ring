            0.156 in./ft. and expansion 24 -> 191 C 0.324 in./ft. (divided by 12). Two-point mean
            values; the curve between the points is PCHIP-interpolated.
          points:
            - [219.15, -0.013]
            - [297.15, 0.0]
            - [464.15, 0.027]

  - id: ffkm
    name: "FFKM (perfloroelastomer)"
    group: elastomer
    low_temp_limit_K:
      value: 255.15
      source: parker_ord5700
      data_quality: literature
      notes: "Parker 2.2.10 'Cold flexibility -18 C to -26 C'. Conservative (warm) end. Parker's recommended static low-temperature limit is about 8 C below TR-10 (2.13.2, p. 2-25)."
    high_temp_limit_K:
      value: 593.15
      source: parker_ord5700
      data_quality: literature
      notes: "Parker 2.2.10 'Up to 320 C'."
    thermal_strain:
      reference_T_K: 297.15
      segments:
        - kind: table
