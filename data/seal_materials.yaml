      data_quality: literature
      notes: "Parker 2.2.1 'Cold flexibility: depending on individual compound, between -34 C and -57 C'. Conservative (warm) end; low-temperature NBR grades reach -57 C. Parker's recommended static low-temperature limit is about 8 C below TR-10 (2.13.2, p. 2-25)."
    tg_K: {value: null, data_quality: placeholder, notes: "Not given by Parker; compound specific."}
    tr10_K: {value: null, data_quality: placeholder, notes: "Compound specific (ASTM D1329); not given per family by Parker."}
    high_temp_limit_K:
