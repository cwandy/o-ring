# Fluids and seal-material compatibility (warning purposes only). See SPEC.md §5.
# compatibility: status = ok | conditional | not_ok | unknown. Missing entries are "unknown".
# The matrix is to be completed by the user; only well-known cases are pre-filled.

DOGRULANMALI:
  - "NTO ve RP-1 kaynama noktası girilmedi (WebBook'ta faz verisi yok; RP-1 tek nokta değil). Hesapta kullanılmıyor, yalnızca bilgi amaçlı."
  - "NBR/EPDM - LOX uyumsuzluğu: NASA-STD-6001 / ASTM G63 ile belge ve test koşulu olarak sabitlenmeli."

fluids:
  - id: lox
    name: "LOX (sıvı oksijen)"
    boiling_point_K: {value: 90.19, source: nist_webbook, data_quality: measured_reference, notes: "WebBook fluid saturation data interpolated at 101.325 kPa: 90.188 K (checked 2026-11-13)."}
    compatibility:
      nbr: {status: not_ok, source: nasa_std_6001, data_quality: literature, notes: "Hydrocarbon elastomers are not LOX compatible (ignition hazard). Source document to be pinned."}
      epdm: {status: not_ok, source: nasa_std_6001, data_quality: literature, notes: "Hydrocarbon elastomers are not LOX compatible (ignition hazard). Source document to be pinned."}
  - id: ln2
    name: "LN2 (sıvı azot)"
    boiling_point_K: {value: 77.36, source: nist_webbook, data_quality: measured_reference, notes: "WebBook fluid saturation data at 101.325 kPa: 77.355 K (checked 2026-11-13)."}
  - id: lh2
    name: "LH2 (sıvı hidrojen)"
    boiling_point_K: {value: 20.37, source: nist_webbook, data_quality: measured_reference, notes: "WebBook fluid saturation data at 101.325 kPa: normal hydrogen 20.369 K, para-hydrogen 20.271 K (checked 2026-11-13)."}
  - id: lch4
    name: "LCH4 (sıvı metan)"
    boiling_point_K: {value: 111.67, source: nist_webbook, data_quality: measured_reference, notes: "WebBook fluid saturation data at 101.325 kPa: 111.667 K (checked 2026-11-13)."}
  - id: ghe
    name: "GHe (helyum gazı)"
    boiling_point_K: {value: 4.22, source: nist_webbook, data_quality: measured_reference, notes: "WebBook fluid saturation data at 101.325 kPa: 4.224 K; GHe is used as a gas."}
  - id: mmh
    name: "MMH"
    boiling_point_K: {value: 364.0, source: nist_webbook, data_quality: literature, notes: "WebBook phase change data, Tboil 364 K (Majer and Svoboda, 1985)."}
  - id: n2h4
    name: "N2H4 (hidrazin)"
    boiling_point_K: {value: 386.65, source: nist_webbook, data_quality: literature, notes: "WebBook phase change data, Tboil 386.65 K +/- 0.5 K (Tipton, Stone et al., 1989)."}
  - id: nto
    name: "NTO (N2O4)"
  - id: rp1
    name: "RP-1"
