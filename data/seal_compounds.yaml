# Seal compound datasheet values supplied by the user (photos of manufacturer datasheets,
# 2026-11-24). Used for the formula-based minimum squeeze (compression set / permanent
# deformation) and the low-temperature check (TR10). Typical values as published; the
# datasheets state they are not a basis for specification.
#   compression_set: fraction of the initial deflection not recovered (ISO 815 / ASTM D395);
#     thermoplastics: ASTM D621 permanent deformation after 24 h under load and 24 h rest
#     (PTFE) or deformation under load (PCTFE, no permanent value given: conservative).
compounds:
  - id: epdm_7ep1197
    seal_material: epdm
    name: "EPDM 7EP1197 (Hutchinson)"
    hardness_shore_a: 70
    compression_set: {value: 0.12, conditions: "24 h at 150 C, ISO 815-1"}
    tr10_K: 227.15          # -46 C, ISO 2921
    brittle_point_K: 218.15 # -55 C, ISO 812
    source: hutchinson_7ep1197
    data_quality: vendor
  - id: ptfe_g400
    seal_material: ptfe
    name: "PTFE G400"
    compression_set: {value: 0.09, conditions: "ASTM D621, 13.7 MPa 24 h + 24 h rest, room temperature (0.19 at 260 C / 41 MPa)"}
    service_K: [73.15, 533.15]  # -200 / +260 C
    source: ptfe_g400_tds
    data_quality: vendor
  - id: pctfe_c100
    seal_material: pctfe
    name: "PCTFE fluteck C100"
    compression_set: {value: 0.01, conditions: "ASTM D621 deformation under 7 MPa, 24 h at 25 C (2.5 % at 70 C, 12 % at 125 C); permanent value not given"}
    service_K: [null, 423.15]  # max 150 C in air
    tensile_modulus_Pa: [1.0e9, 1.6e9]
    source: fluteck_c100_tds
    data_quality: vendor

