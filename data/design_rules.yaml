        - {cs_nominal_in: 0.500, radius_min_in: 0.030, radius_max_in: 0.045, depth_min_in: 0.370, depth_max_in: 0.380, width_min_in: 0.638, width_max_in: 0.645}

  - material_group: elastomer
    gland_type: dynamic_reciprocating
    notes: "Placeholder only; not implemented (K19). Parker 3.6: dynamic max squeeze about 16 % (small cross-sections up to 25 %)."

  - material_group: thermoplastic
    gland_type: static_radial
    squeeze_max: {value: null, data_quality: placeholder, severity: warn}
    fill_max: {value: null, data_quality: placeholder, severity: warn}
    fill_hard_max: {value: null, data_quality: placeholder, severity: fail}
    warnings: [split_groove_required, cold_flow, spring_energized_recommended]
    recommended_squeeze:
      source: machinerys_handbook_31
      data_quality: literature
      notes: >-
        Machinery's Handbook 31st ed., O-ring section: glands for solid PTFE O-rings often target
        10-20 % squeeze for cross-sections up to 0.210 in (5.33 mm) and 10-15 % for 0.210-0.275 in;
        groove width about 10 % larger than the cross-section, clearance gap not above 0.005 in.
        Applied to PCTFE as well (stiffer than PTFE; no PCTFE-specific source found).
      bands:
