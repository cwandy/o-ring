# Housing (gland body) metals. See SPEC.md §5 and §13 (K7: selectable tempers, K16: hydrogen).
#
# nist_poly4 segment: NIST TRC form  y = a + bT + cT^2 + dT^3 + eT^4  for T > T_low_K,
#                     y = f for T < T_low_K;  y = 1e5 * (L_T - L_293)/L_293  (scale 1e-5).
# Coefficients are copied verbatim from the cited NIST page.
# Above room temperature: Bal Seal TR-18 mean coefficients (vendor) to ~100 C; Sandia for 17-4 PH
# to 568 K. Inconel 718: <= 300 K only (no open source found above).

DOGRULANMALI:
  - "Metaller 300 K üstü: Bal Seal TR-18 ortalama katsayıları (Al 100 C, PH 93 C, 304 ve 17-7 PH 316 C, 17-4 PH Sandia 295 C). Al 1100/3003 ve SS316 için 6061/304 değeri vekil (extrapolated). Inconel 718: 300 K üstü veri yok."
  - "17-4 PH, 15-5 PH, 17-7 PH: 200 K altı termal büzülme ölçülmüş açık kaynak yok; NIST Fe-9Ni eğrisinden Clark (1968) yöntemiyle tahmin (extrapolated)."
  - "17-4 PH, 15-5 PH, 17-7 PH: kriyojenik tokluk uyarısı 0 C altında (Sandia SAND2012-7321: 'sıfırın altında tokluk kaybı', nitel). Isıl işleme özgü Charpy/K1c verisiyle doğrulanmalı."
  - "Hidrojen gevrekleşmesi bayrakları Sandia SAND2012-7321'e göre (PH çelikler: bölüm 1700/1810; IN718: bölüm 2301 karşılaştırması). 304/316/Al için bayrak yok."
  - "Al 1100: saf alüminyum verisi temsilci olarak kullanıldı (kullanıcı onayı, 2026-11-13)."
  - "Al 7075-T6: 116-293 K Monograph 29; 116 K altı 6061 eğrisi ölçeklenerek tahmin (extrapolated)."
  - "NIST 304 ve 316 için aynı katsayıları, 3003-F ve 6061-T6 için aynı katsayıları veriyor."

materials:
  - id: al6061
    name: "Al 6061"
    tempers:
      - {id: O, name: "O (tavlanmış)"}
      - {id: T4, name: "T4"}
      - {id: T6, name: "T6"}
      - {id: T651, name: "T651"}
      - {id: T6511, name: "T6511"}
    thermal_strain:
      reference_T_K: 293.0
      segments:
        - kind: nist_poly4
          coefficients: {a: -4.1277e+2, b: -3.0389e-1, c: 8.7696e-3, d: -9.9821e-6, e: 0.0}
          scale: 1.0e-5
          T_low_K: 18
          f: -415.45
          range_K: [4, 300]
          fit_error_pct: 4
          source: nist_trc_al6061
          data_quality: measured_reference
        - kind: table
          quantity: expansion
          scale: 1.0
          source: balseal_tr18
          data_quality: vendor
          notes: >-
            Bal Seal TR-18 mean CTE Al 6061 20->100 C 23.6 um/m/C: dL/L = 23.6e-6 * 80 K.
          points:
            - [373.15, 0.001888]
