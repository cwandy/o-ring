            - [140, -0.0014752]
            - [150, -0.0013993]
            - [160, -0.0013207]
            - [170, -0.0012394]
            - [180, -0.0011555]
            - [190, -0.001069]
        - kind: table
          quantity: expansion
          scale: 1.0
          source: balseal_tr18
          data_quality: vendor
          notes: >-
            Bal Seal TR-18 Table 4.1 mean CTE from RT, 17-4 PH H900: 10.4 um/m/C at -73 C, 10.8 at 0 and 93 C (Condition A 10.8 at 0-93 C). dL/L = alpha * (T - 21.1 C); RT taken as 293.15 K (difference < 1.2e-5).
          points:
            - [200.15, -0.00097864]
            - [273.15, -0.00022788]
