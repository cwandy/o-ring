      - {id: H1150D, name: "H1150-D"}
      - {id: H1150M, name: "H1150M"}
    cryo_toughness:
      warning: true
      threshold_K:
        value: 273.15
        source: sandia_h2_tech_ref
        data_quality: literature
        notes: "SAND2012-7321 section 1810: 'martensitic stainless steels suffer a loss in toughness at low (subzero) temperature'. Qualitative: warning below 0 C; the actual ductile-brittle behaviour depends on temper (H1150 tougher than H900) - verify with Charpy/K1c data for the temper."
      notes: "Martensitic PH steel: loss of toughness at subzero temperature."
    hydrogen_embrittlement:
      value: true
      source: sandia_h2_tech_ref
      data_quality: literature
      notes: "SAND2012-7321 section 1810: Fe-Cr-Ni precipitation-strengthened martensitic stainless steels (17-4 PH, 15-5 PH) are very sensitive to hydrogen-assisted fracture; degradation increases with strength; solution-annealed material appears much less sensitive."
    thermal_strain:
      reference_T_K: 293.15
      segments:
        - kind: table
          quantity: expansion
          scale: 1.0
          source: nist_trc_fe9ni
          data_quality: extrapolated
          notes: >-
            NIST Fe-9Ni (martensitic/ferritic) curve, relative to 293.15 K, scaled by 0.980 so that it passes through the Bal Seal -73 C point (Clark 1968 method: total contraction proportional to the RT coefficient). Estimate - no measured cryogenic data found for this alloy (tools/derive_thermal_data.py).
