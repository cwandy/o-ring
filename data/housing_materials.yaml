    hydrogen_embrittlement: {value: true, source: sandia_h2_tech_ref, data_quality: placeholder}
    thermal_strain: {reference_T_K: 293.15, segments: []}

  - id: ph17_7
    name: "17-7 PH"
    notes: "User wrote '17-5 PH'; no common alloy by that name, interpreted as 17-7 PH (SPEC §1, K8)."
    tempers:
      - {id: TH1050, name: "TH1050"}
      - {id: RH950, name: "RH950"}
