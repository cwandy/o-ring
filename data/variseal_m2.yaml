# Trelleborg Turcon Variseal M2 installation dimensions (metric), from the catalogue pages
# supplied by the user (Edition October 2026):
#   rod (RVA):    Table 39 (groove details), Table 41 (installation dimensions), p. 135-136
#   piston (PVA): Table 120 (groove details), Table 122 (installation dimensions), p. 352-353
# Diameters in mm. Groove diameter = d (rod) + offset, or D (bore) - offset (piston).
# Tolerances: rod d h9 / groove D1 H9; bore D H9 / groove d1 h9; groove width L1 +0.2/0.
# s_max: maximum radial clearance by pressure (MPa upper bounds 2, 10, 20, 40); the catalogue
# recommends reducing the gap at >= 80 C and a back-up ring above 40 MPa.
source_rod: trelleborg_variseal_m2_rod
source_piston: trelleborg_variseal_m2_piston
data_quality: vendor
pressure_bounds_MPa: [2, 10, 20, 40]
r1_max_mm: {0: 0.25, 1: 0.38, 2: 0.38, 3: 0.38, 4: 0.51, 5: 0.51}  # Table 39 / 120, series 000..500
rod:
  # series, recommended (standard) range d_min, d_max, extended range, offset, width L1, s_max
