  - {series: PVA1, std: [14.0, 24.9], ext: [10.0, 200.0], offset: 4.5, width: 3.6, s_max: [0.25, 0.15, 0.10, 0.07]}
  - {series: PVA2, std: [25.0, 45.9], ext: [16.0, 400.0], offset: 6.2, width: 4.8, s_max: [0.35, 0.20, 0.15, 0.08]}
  - {series: PVA3, std: [46.0, 124.9], ext: [28.0, 700.0], offset: 9.4, width: 7.1, s_max: [0.50, 0.25, 0.20, 0.10]}
  - {series: PVA4, std: [125.0, 999.9], ext: [45.0, 1600.0], offset: 12.2, width: 9.5, s_max: [0.60, 0.30, 0.25, 0.12]}
  - {series: PVA5, std: [1000.0, 2500.0], ext: [100.0, 2500.0], offset: 19.0, width: 15.0, s_max: [0.90, 0.50, 0.40, 0.20]}

