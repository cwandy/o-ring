# Extrusion limits: maximum allowed extrusion gap vs pressure per O-ring hardness.
# Source: Parker ORD 5700 Figure 3-2 'Limits for Extrusion' (p. 3-3), digitized from the
# vector chart at 600 dpi (pressure axis is non-uniform; mapped piecewise between labelled
# grid lines in log space). points: [pressure_psi, total_diametral_clearance_in].
#
# Parker's x axis: "Total Diametral Clearance (Radial Clearance if Concentricity Between Piston
# and Cylinder is Rigidly Maintained)" -> it is the largest one-sided extrusion gap. The program
# compares it with the worst-case one-sided gap (clearance pushed to one side by eccentricity).
# Each curve ends where it meets the pressure axis (zero allowed clearance).
# Basis (Parker): 100,000 cycles 0 -> p at 60/min, 71 C, no back-up rings; include bore
# breathing; apply a safety factor for sharp edges and higher temperatures.

DOGRULANMALI:
  - "Ekstrüzyon eğrileri grafikten sayısallaştırıldı (Parker Şekil 3-2); okuma belirsizliği yaklaşık ±0.0003 in."
  - "Parker grafiği 70, 80 ve 90 Shore A içindir; ara sertliklerde bir alttaki eğri kullanılır, 70 altı için veri yok."
  - "Grafik 100 psi altını kapsamaz; 100 psi altında 100 psi değeri kullanılır (güvenli taraf)."

source: parker_ord5700
data_quality: literature
pressure_unit: psi
clearance_unit: in
silicone_clearance_factor: 0.4
silicone_factor_notes: "Fig. 3-2 footnote: reduce the clearance shown by 60 % for silicone or fluorosilicone. (Design Chart 4-2 note (c) and 4.2 text say 50 % for the design-chart clearances.)"
reference_temperature_K: 344.15
