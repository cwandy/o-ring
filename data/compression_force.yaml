# O-ring compression load per linear inch of seal (lbf/in), ranges per cross-section,
# percent compression and Shore A hardness.
# Source: Parker ORD 5700, Figures 2-4 to 2-8 (pp. 2-11 to 2-13), digitized from 300 dpi renders
# of the vector charts (log x axis 0.1-1000 lbf/in calibrated on the chart frame). Bars read as
# [min, max]. Parker Table 2-3 (p. 2-10): which part of the bar applies -
#   hardness within normal tolerance: ring I.D. < 25.4 mm -> middle third, > 25.4 mm -> lower half;
#   hardness above normal:            ring I.D. < 25.4 mm -> upper third, > 25.4 mm -> upper half.
# Values are at room temperature; elastomers harden when cold (Parker 2.4.2: a 70 Shore A
# compound may reach 85 at -34 C), which raises the force - not modelled.

